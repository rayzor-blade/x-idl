[package]
name = "x_idl"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/rayzor-blade/x-idl"
license = "MIT"
description = "IDL-based native bindings generator for Ash, Rayzor and Caribou runtimes"


[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
# The WebIDL parser the wire generator reads the whole IDL with.
weedle2 = "5"
rand = "0.8.4"
